[project]
name = "smart-reporting"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]",
    "pydantic-settings>=2.5,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "openai>=1.50,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24",
    "chromadb>=0.5",
    "json-repair>=0.30",
    "pytest>=8.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"